services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jwt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jwt || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./auth-service
    image: auth-service:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-this-is-a-very-long-and-secure-jwt-secret-key-32b-min}
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
    ports:
      - "8081:8081"
    networks:
      - backend
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    image: api-gateway:local
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    networks:
      - backend
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: "./frontend auth example"
      args:
        VITE_API_BASE: http://localhost:8080
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: auth-frontend:local
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3030:80"
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
    internal: true
  public:
    driver: bridge


