org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000
systemProp.http.keepAlive=true
systemProp.http.maxConnections=20
systemProp.org.gradle.internal.launcher.welcomeMessageEnabled=false
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT

