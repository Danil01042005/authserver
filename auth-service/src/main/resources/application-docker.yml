server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://postgres:5432/jwt
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect



logging:
  level:
    root: INFO
    org:
      springframework:
        security: INFO
    ru:
      auth:
        config:
          JwtAuthenticationFilter: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        all: true
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 1ms
      slo:
        "[http.server.requests]":
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: false