server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/jwt
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # gateway config moved to separate api-gateway service

jwt:
  # HS256 requires a key >= 256 bits (32+ chars). Use env var in prod.
  secret: ${JWT_SECRET:this-is-a-very-long-and-secure-jwt-secret-key-32b-min}

logging:
  level:
    org.springframework.security: DEBUG