server:
  port: 8082

spring:
  application:
    name: example-under-armor-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://api-gateway:8080/.well-known/jwks.json

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        all: true
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 1ms
      slo:
        "[http.server.requests]":
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: false



